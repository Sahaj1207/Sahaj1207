<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="900" height="150" role="img" aria-label="Sahaj — building AI-native software. Now building HARIKA, shipped FLOAT, open to work.">
  <defs>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pillClip">
      <rect x="380" y="45" width="140" height="60" rx="30">
        <animate attributeName="x" values="380;140" keyTimes="0;1" dur="0.9s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.9 0.25 1"/>
        <animate attributeName="width" values="140;620" keyTimes="0;1" dur="0.9s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.9 0.25 1"/>
      </rect>
    </clipPath>
    <style>
      text { font-family: "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .label { font-size: 11px; font-weight: 600; letter-spacing: 2px; fill: #8b8b99; }
      .main { font-size: 18px; font-weight: 500; fill: #f5f5f7; }
      .accent { fill: url(#mono); font-weight: 700; }
      .slide { opacity: 0; animation: cycle 16s infinite; animation-fill-mode: both; }
      .s1 { animation-delay: 1.1s; }
      .s2 { animation-delay: 5.1s; }
      .s3 { animation-delay: 9.1s; }
      .s4 { animation-delay: 13.1s; }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(8px); }
        3%   { opacity: 1; transform: translateY(0); }
        22%  { opacity: 1; transform: translateY(0); }
        25%  { opacity: 0; transform: translateY(-8px); }
        100% { opacity: 0; transform: translateY(-8px); }
      }
      .bar { transform-box: fill-box; transform-origin: center; animation: eq 1.1s ease-in-out infinite; }
      .b2 { animation-delay: -0.2s; } .b3 { animation-delay: -0.45s; } .b4 { animation-delay: -0.7s; } .b5 { animation-delay: -0.9s; }
      @keyframes eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }
      .fade-in { opacity: 0; animation: fadein 0.6s 1s forwards; }
      @keyframes fadein { to { opacity: 1; } }
      .halo { opacity: 0; animation: halo 4s 1.2s ease-in-out infinite; }
      @keyframes halo { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }
      @media (prefers-reduced-motion: reduce) {
        .slide, .bar, .halo { animation: none; }
        .s1 { opacity: 1; }
      }
    </style>
  </defs>

  <!-- soft glow under the island -->
  <rect class="halo" x="160" y="104" width="580" height="2" rx="1" fill="url(#glow)"/>

  <g clip-path="url(#pillClip)">
    <rect x="0" y="45" width="900" height="60" fill="#000"/>
    <rect x="0" y="45" width="900" height="60" fill="none" stroke="#1f1f27" stroke-width="2"/>

    <g class="fade-in">
      <!-- monogram -->
      <circle cx="178" cy="75" r="20" fill="url(#mono)"/>
      <text x="178" y="81.5" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">S</text>

      <!-- rotating status -->
      <g class="slide s1">
        <text class="label" x="214" y="68">HELLO, WORLD</text>
        <text class="main" x="214" y="91">I'm <tspan class="accent">Sahaj</tspan> — I build AI-native software</text>
      </g>
      <g class="slide s2">
        <text class="label" x="214" y="68">NOW BUILDING</text>
        <text class="main" x="214" y="91"><tspan class="accent">HARIKA</tspan> · an open-source AI operating system</text>
      </g>
      <g class="slide s3">
        <text class="label" x="214" y="68">SHIPPED</text>
        <text class="main" x="214" y="91"><tspan class="accent">FLOAT</tspan> · a Dynamic Island for Windows</text>
      </g>
      <g class="slide s4">
        <text class="label" x="214" y="68">OPEN TO</text>
        <text class="main" x="214" y="91">internships, freelance &amp; <tspan class="accent">full-time</tspan> roles</text>
      </g>

      <!-- equalizer -->
      <g fill="url(#mono)">
        <rect class="bar b1" x="690" y="62" width="4" height="26" rx="2"/>
        <rect class="bar b2" x="698" y="62" width="4" height="26" rx="2"/>
        <rect class="bar b3" x="706" y="62" width="4" height="26" rx="2"/>
        <rect class="bar b4" x="714" y="62" width="4" height="26" rx="2"/>
        <rect class="bar b5" x="722" y="62" width="4" height="26" rx="2"/>
      </g>
    </g>
  </g>
</svg>
